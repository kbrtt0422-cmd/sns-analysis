<title>AI Company バーチャルオフィス</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ink:#4A3A42; --ink-soft:#9A8791;
    --panel:#FFFFFF; --panel-brd:#F2DCE4; --cream:#FBF5EF;
    --accent:#E85E8A; --gold:#C9A24B; --ok:#4A9A66; --warn:#B07A1E;
    --sns:#E86A96; --sales:#7FA6D9; --acct:#7FBF98; --ceo:#C9A24B; --cmo:#E85E8A; --cto:#6FA8BF; --human:#A099A5;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --serif:'Cormorant Garamond',serif;
  }
  html,body{height:100%}
  body{
    margin:0; background:#FBEDF0; color:var(--ink);
    font-family:'Zen Maru Gothic',"Hiragino Maru Gothic ProN",sans-serif;
    overflow:hidden; font-size:14px;
  }
  #scene{position:fixed; inset:0; display:block; touch-action:none; cursor:grab}
  #scene:active{cursor:grabbing}

  .hud{position:fixed; inset:0; pointer-events:none; z-index:10}
  .hud > *{pointer-events:auto}

  .chip{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--panel); border:1px solid var(--panel-brd); border-radius:14px;
    padding:7px 13px; box-shadow:0 4px 14px rgba(230,120,150,.18); font-weight:500;
  }
  .dot{width:8px;height:8px;border-radius:50%;flex:none}

  /* 左上: 社名 */
  .brand{position:absolute; top:16px; left:16px; display:flex; gap:8px; flex-wrap:wrap; max-width:calc(100vw - 32px)}
  .brand .name{font-family:var(--serif); font-weight:600; font-size:16px; letter-spacing:.09em; color:var(--ink)}
  .brand .sub{font-size:12px; color:var(--ink-soft)}
  .agent-status{font-size:12px; color:var(--ink-soft)}
  .agent-status b{color:var(--ink); font-weight:700}

  /* 中央上: パイプライン */
  .pipeline{position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:2px; background:var(--panel); border:1px solid var(--panel-brd);
    border-radius:16px; padding:5px; box-shadow:0 4px 14px rgba(230,120,150,.18)}
  .stage{padding:5px 13px; border-radius:12px; font-size:12.5px; font-weight:500; color:var(--ink-soft); white-space:nowrap}
  .stage.done{color:var(--ok)}
  .stage.active{background:var(--accent); color:#fff; font-weight:700}
  .stage .n{opacity:.6; margin-right:3px; font-family:var(--mono); font-size:11px}

  /* 右上: 操作 */
  .controls{position:absolute; top:16px; right:16px; display:flex; gap:8px}
  button.chip{cursor:pointer; font:inherit; color:var(--ink); font-weight:500}
  button.chip:hover{border-color:var(--accent)}
  button.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  button.chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
  .live{color:var(--accent); font-weight:700; letter-spacing:.1em; font-family:var(--serif); font-size:15px}
  .live .dot{background:var(--accent)}
  @media (prefers-reduced-motion:no-preference){
    .live .dot{animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  }

  /* 業務ボード */
  .board{position:absolute; top:64px; left:50%; transform:translateX(-50%);
    width:404px; max-width:calc(100vw - 32px);
    background:var(--panel); border:1px solid var(--panel-brd);
    border-radius:16px; box-shadow:0 10px 30px rgba(220,110,145,.22); overflow:hidden}
  .board h2{margin:0; padding:10px 16px 8px; font-size:12px; font-weight:700; letter-spacing:.14em;
    display:flex; justify-content:space-between; align-items:center; color:var(--ink);
    border-bottom:2px solid #FAE3EA}
  .board h2 .cnt{font-family:var(--mono); font-weight:400; color:var(--ink-soft); letter-spacing:0}
  .board ul{list-style:none; margin:0; padding:6px 0}
  .board li{display:flex; align-items:center; gap:9px; padding:5px 16px; font-size:12.5px}
  .board .who{color:var(--ink-soft); font-size:11.5px; flex:none; width:6em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .board .task{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .board .st{flex:none; font-size:11px; padding:2px 9px; border-radius:99px; font-weight:700}
  .st-0{color:#9A8791; background:#F5EFF1}
  .st-1{color:var(--warn); background:#FBF0DA}
  .st-2{color:#4A7AB0; background:#E7F0FA}
  .st-3{color:var(--ok); background:#E5F5EA}

  /* 成果物モニター */
  .monitor{position:absolute; top:64px; right:16px; width:302px; max-width:calc(100vw - 32px);
    background:var(--panel); border:1px solid var(--panel-brd); border-radius:16px;
    box-shadow:0 10px 30px rgba(220,110,145,.22); overflow:hidden}
  .monitor h2{margin:0; padding:10px 14px 8px; font-size:12px; font-weight:700; letter-spacing:.12em;
    display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #FAE3EA}
  .monitor h2 .cnt{font-family:var(--mono); font-weight:400; color:var(--ink-soft)}
  .doc{margin:10px 12px 8px; background:var(--cream); border:1px solid #F4E4D8; border-radius:12px;
    padding:10px 13px; min-height:118px}
  .doc .t{font-weight:700; font-size:12.5px; margin-bottom:6px; text-align:center}
  .doc .l{font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); line-height:1.75;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .doc .l b{color:var(--ink); font-weight:500}
  .files{display:flex; flex-wrap:wrap; gap:5px; padding:2px 12px 12px}
  .file{font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:99px;
    background:#FAEDF1; border:1px solid var(--panel-brd); color:var(--ink-soft);
    transition:background .4s,color .4s,border-color .4s}
  .file.hot{background:var(--accent); color:#fff; border-color:var(--accent)}

  /* 活動ログ */
  .log{position:absolute; left:16px; bottom:16px; width:330px; max-width:calc(100vw - 32px);
    display:flex; flex-direction:column-reverse; gap:5px}
  .log .e{display:flex; align-items:baseline; gap:8px; background:var(--panel);
    border:1px solid var(--panel-brd); border-radius:12px; padding:6px 12px; font-size:12px;
    box-shadow:0 3px 10px rgba(230,120,150,.14)}
  .log .e .dot{align-self:center}
  .log .e .who{font-weight:700; flex:none}
  .log .e .what{color:var(--ink-soft); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .log .e:nth-child(n+2){opacity:.82}
  .log .e:nth-child(n+4){opacity:.55}
  .log .e:nth-child(n+6){opacity:.3}

  /* 取締役会の間 */
  .throne{position:absolute; right:16px; bottom:16px; width:302px; max-width:calc(100vw - 32px);
    background:var(--panel); border:1px solid var(--panel-brd); border-radius:16px;
    box-shadow:0 10px 30px rgba(220,110,145,.22)}
  .throne h2{margin:0; padding:10px 14px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:8px}
  .throne h2 .seal{width:17px;height:17px;border-radius:50%;background:var(--gold);flex:none;
    color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700}
  .throne .body{border-top:2px solid #FAE3EA; padding:9px 14px; font-size:12px; color:var(--ink-soft)}
  .throne .row{display:flex; justify-content:space-between; gap:10px; padding:3px 0}
  .throne .ok{color:var(--ok); font-weight:700; flex:none}
  .throne .wait{color:var(--warn); font-weight:700; flex:none}
  .throne .foot{display:flex; gap:7px; padding:0 14px 12px}
  .throne .foot .chip{padding:5px 12px; font-size:12px; box-shadow:none}

  /* 吹き出し */
  .bubbles{position:absolute; inset:0; overflow:hidden; pointer-events:none}
  .bub{position:absolute; transform:translate(-50%,-100%); max-width:230px;
    background:#fff; border:1.5px solid #F0C3D2; border-radius:14px;
    padding:6px 12px 7px; font-size:12.5px; line-height:1.45;
    box-shadow:0 5px 16px rgba(220,110,145,.25); white-space:normal}
  .bub::after{content:""; position:absolute; left:50%; bottom:-7px; transform:translateX(-50%) rotate(45deg);
    width:11px; height:11px; background:#fff; border-right:1.5px solid #F0C3D2; border-bottom:1.5px solid #F0C3D2}
  .bub .n{display:block; font-size:10px; font-weight:700; margin-bottom:1px}
  .bub.think{border-style:dashed; color:var(--ink-soft)}
  .bub.think::after{border-style:dashed}

  @media (max-width:860px){
    .board{left:16px; transform:none; width:auto; right:16px; top:110px}
    .monitor{top:auto; bottom:76px; right:16px; width:auto; left:16px}
    .throne{display:none}
    .log{bottom:16px; width:auto; right:16px}
    .log .e:nth-child(n+4){display:none}
    .pipeline{top:60px; max-width:calc(100vw - 32px); overflow-x:auto}
    .board.folded ul,.monitor.folded .doc,.monitor.folded .files{display:none}
  }
  [hidden]{display:none!important}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

    lines:['提案書は相手の言葉で書く','KAZUさん向けスクリプト最終化中']},
  {id:'dm', name:'DM', role:'営業部', dept:'sales', hair:'#4A4A4A',
    lines:['営業っぽくないDMとは…考え中…','初回接触は売らない。役に立つ']},
  {id:'quote', name:'見積', role:'経理部', dept:'acct', hair:'#5A5A3A',
    lines:['この項目、見積もりに入ってます？','価格表、3プランで確定です']},
  {id:'invoice', name:'請求', role:'経理部', dept:'acct', hair:'#3A5A5A',
    lines:['支払期限は今日です（にっこり）','入金確認、あと1件']},
  {id:'monthly', name:'月次', role:'経理部', dept:'acct', hair:'#6A5A4A',
    lines:['経費精算、証憑がありません','今月の広告費、予算内です']},
  {id:'kazu', name:'KAZU', role:'営業・人間', dept:'human', hair:'#2A2A2A',
    lines:['（人間）休憩してきます','無料相談、今日は2件です']},
];
const byId = Object.fromEntries(AGENTS.map(a=>[a.id,a]));

/* 決定#005「Tiafulローンチ」の実タスク */
const TASKS = [
  {t:'Tiaful Instagramアカウント開設', a:'sara', s:2},
  {t:'Week0 オリエン動画の台本', a:'reel', s:1},
  {t:'投稿カレンダー（Month1）', a:'planner', s:1},
  {t:'キャプション・タグ設計', a:'caption', s:0},
  {t:'Meta広告テスト計画（月5万円〜）', a:'analytics', s:0},
  {t:'無料相談トークスクリプト', a:'proposal', s:1},
  {t:'UTAGE会員サイトMVP構成', a:'ken', s:1},
  {t:'受講プラン価格表・見積', a:'quote', s:3},
];
const ST_LABEL = ['待機中','作業中','検収待ち','完了'];

/* projects/sns-school/ の実ファイル */
const FILES = ['curriculum.md','reel-scripts.md','content-plan-month1.md','post-plan.md',
  'grading-rubric.md','brand-guideline.md','canva-template-spec.md','hearing-sheet.md',
  'marketing-plan.md','go-to-market.md'];

const DOCS = [
  {title:'{{curriculum.heading}}', file:'curriculum.md', lines:[
    ['Week0','オリエンテーション ― 学び方と全体像'],
    ['Week1','プロフィール設計 ― 3秒で伝わる肩書'],
    ['Week2','投稿企画 ― ネタ切れしないカレンダー'],
    ['Week3','リール制作 ― 顔出しなしの型'],
    ['Week4','分析と改善 ― 保存率で判断する'],
  ]},
  {title:'Week0 台本ドラフト', file:'reel-scripts.md', lines:[
    ['HOOK','「顔出しなしでSNSは伸びるのか？」'],
    ['本編','受講の進め方 / 添削の受け方'],
    ['演出','イラストモーション + AI音声'],
    ['尺','85–100分 → 圧縮検討中'],
    ['CTA','課題①プロフィール棚卸しへ'],
  ]},
  {title:'Meta広告テスト計画', file:'marketing-plan.md', lines:[

    ['配信面','Instagram リール / 発見タブ'],
    ['KPI','CPL 3,000円以下で継続'],

    ['判定','2週間で継続/停止を判断'],
  ]},
];

/* ===== 3Dシーン ===== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#FBEDF0');
scene.fog = new THREE.Fog('#FBEDF0', 48, 100);

const camera = new THREE.PerspectiveCamera(42, 1, .1, 200);
const camTarget = new THREE.Vector3(0, 1.2, 1.5);
let camTheta = 0, camPhi = 1.2, camR = 25;

scene.add(new THREE.HemisphereLight('#FFF6F0', '#DEC3CB', 1.0));
const sun = new THREE.DirectionalLight('#FFE9DC', .65);
sun.position.set(-9, 15, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-18, right:18, top:18, bottom:-14, far:50});
scene.add(sun);
const glow = new THREE.PointLight('#FFE2C9', .35, 26);
glow.position.set(0, 8.5, -2);
scene.add(glow);

const M = (c, rough=.85) => new THREE.MeshStandardMaterial({color:c, roughness:rough});
const box = (w,h,d,mat) => new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
function cast(m){ m.castShadow = true; m.receiveShadow = true; return m; }
const GOLD = new THREE.MeshStandardMaterial({color:'#D4B36A', roughness:.35, metalness:.65});
const WHITE = M('#FDFCFA', .5);

/* 床（アイボリーの艶床 + ラグ） */
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 46), M('#F6F1EB', .35));
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
scene.add(floor);
function rug(x, z, r, color){
  const m = new THREE.Mesh(new THREE.CircleGeometry(r, 42), M(color, .95));
  m.rotation.x = -Math.PI/2; m.position.set(x, .012, z); m.receiveShadow = true;
  scene.add(m);
}
rug(0, -6.2, 3.4, '#F2D5DC');       /* CEOラグ（ブラッシュピンク） */
rug(-4.3, .8, 5.2, '#F7E8E0');      /* SNS部 */
rug(0, 4.6, 5.2, '#EFEAF3');        /* 営業部 */
rug(8.2, 1.8, 4.4, '#E9F1EA');      /* 経理部 */

/* 背景の壁（クリーム × 金の縁 × アーチ窓） */
const wallDraws = [];
function texturedPlane(w, h, draw, pxw, pxh){
  const c = document.createElement('canvas'); c.width = pxw; c.height = pxh;
  draw(c.getContext('2d'), pxw, pxh);
  const tex = new THREE.CanvasTexture(c);
  wallDraws.push(()=>{ draw(c.getContext('2d'), pxw, pxh); tex.needsUpdate = true; });
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({map:tex, fog:false}));
}
function drawWall(x, W, H){
  x.fillStyle = '#FAF3EC'; x.fillRect(0,0,W,H);
  /* 腰壁 */
  x.fillStyle = '#F3E4DA'; x.fillRect(0, H*.72, W, H*.28);
  x.strokeStyle = '#D4B36A'; x.lineWidth = 6;
  x.beginPath(); x.moveTo(0, H*.72); x.lineTo(W, H*.72); x.stroke();
  /* アーチ窓 ×3（淡いピンクの空） */
  const win = (cx)=>{
    const ww = W*.16, wh = H*.5, top = H*.14;
    const g = x.createLinearGradient(0, top, 0, top+wh);
    g.addColorStop(0, '#FDE7EC'); g.addColorStop(1, '#F7CBD6');
    x.fillStyle = g;
    x.beginPath();
    x.moveTo(cx-ww/2, top+wh);
    x.lineTo(cx-ww/2, top+ww/2);
    x.arc(cx, top+ww/2, ww/2, Math.PI, 0);
    x.lineTo(cx+ww/2, top+wh);
    x.closePath(); x.fill();
    x.strokeStyle = '#FFFFFF'; x.lineWidth = 14; x.stroke();
    x.strokeStyle = '#E8D9C9'; x.lineWidth = 3;
    x.beginPath(); x.moveTo(cx, top+8); x.lineTo(cx, top+wh); x.stroke();
  };
  win(W*.2); win(W*.5); win(W*.8);

function person(a){
  const g = new THREE.Group();
  const body = cast(new THREE.Mesh(new THREE.CylinderGeometry(.2,.26,.52,10), M(DEPT_COLOR[a.dept],.75)));
  body.position.y = .82;
  const head = cast(new THREE.Mesh(new THREE.SphereGeometry(.2,14,12), M('#F2D3B3',.7)));

  const hair = cast(new THREE.Mesh(new THREE.SphereGeometry(.21,12,8,0,Math.PI*2,0,Math.PI/2.4), M(a.hair,.85)));
  hair.position.y = 1.33;
  const armL = cast(box(.09,.3,.09, M(DEPT_COLOR[a.dept],.75))); armL.position.set(-.26,.86,.1); armL.rotation.x = -.9;
  const armR = armL.clone(); armR.position.x = .26;
  g.add(body, head, hair, armL, armR);

function log(who, what, color){
  const e = document.createElement('div');
  e.className = 'e';
  e.innerHTML = `<span class="dot" style="background:${color}"></span><span class="who">${who}</span><span class="what">${what}</span>`;

/* 吹き出し（3D頭上に投影） */
const activeBubs = [];
const v3 = new THREE.Vector3();
function say(a, text, think){
  if(!bubbleOn) return;
  if(activeBubs.length >= 3) removeBub(activeBubs[0]);
  const el = document.createElement('div');
  el.className = 'bub' + (think ? ' think' : '');
  el.innerHTML = `<span class="n" style="color:${DEPT_COLOR[a.dept]}">${a.name} <span style="opacity:.5;font-weight:400">${a.role}</span></span>${text}`;
  bubbles.appendChild(el);
  activeBubs.push({el, id:a.id, until:performance.now()+4600});
}
function removeBub(b){
  b.el.remove();
  const i = activeBubs.indexOf(b);
  if(i>=0) activeBubs.splice(i,1);
}
function layoutBubbles(){
  const w = innerWidth, h = innerHeight, now = performance.now();
  for(const b of [...activeBubs]){
    if(now > b.until){ removeBub(b); continue; }
    rig[b.id].head.getWorldPosition(v3);
    v3.y += .55;
    v3.project(camera);
    if(v3.z > 1){ b.el.hidden = true; continue; }
    b.el.hidden = false;
    b.el.style.left = Math.min(Math.max((v3.x*.5+.5)*w, 90), w-90) + 'px';
    b.el.style.top  = Math.max((-v3.y*.5+.5)*h, 60) + 'px';
  }
}

/* ===== シミュレーション ===== */
let simOn = true, bubbleOn = true, camAuto = true;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduced) camAuto = false;

const focusEl = $('focusline');
function setFocus(a, verb){
  focusEl.innerHTML = `<span class="dot" style="background:${DEPT_COLOR[a.dept]}"></span><span>${a.name}（${a.role}）<b>${verb}</b></span>`;
}

function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function tick(){
  if(!simOn) return;
  const r = Math.random();
  const working = AGENTS.filter(a=>rig[a.id].present);
  if(r < .34){                       /* 独り言 */
    const a = pick(working);
    const think = Math.random() < .3;
    say(a, think ? '考え中…' : pick(a.lines), think);
  } else if(r < .56){                /* タスク前進 */
    const cand = TASKS.filter(t=>t.s < 3);
    if(cand.length){
      const t = pick(cand);
      t.s++;
      const a = byId[t.a];
      renderBoard();
      const msg = t.s===1 ? `着手: ${t.t}` : t.s===2 ? `検収依頼: ${t.t}` : `完了: ${t.t}`;
      log(a.name, msg, DEPT_COLOR[a.dept]);
      setFocus(a, ST_LABEL[t.s]);
      if(t.s===2) setTimeout(()=>{ if(simOn){ log('Jobs','検収中…数字を確認', DEPT_COLOR.exec); say(byId.jobs, pick(byId.jobs.lines)); }}, 2600);
    }
  } else if(r < .78){                /* 成果物更新 */
    const f = pick(FILES);
    const chip = files.querySelector(`[data-f="${f}"]`);
    files.querySelectorAll('.file.hot').forEach(x=>x.classList.remove('hot'));
    if(chip) chip.classList.add('hot');
    const d = DOCS.find(x=>x.file===f);
    if(d) renderDoc(DOCS.indexOf(d)); else renderDoc((docIdx+1)%DOCS.length);
    const owner = pick(['reel','planner','caption','ken','sara']);
    log(byId[owner].name, `成果物更新: ${f}`, DEPT_COLOR[byId[owner].dept]);
    setFocus(byId[owner], '執筆中');
  } else if(r < .9){                 /* 指示 */
    const boss = pick([byId.jobs, byId.sara, byId.ken]);
    const sub = pick(working.filter(a=>a.dept!=='exec' && a.dept!=='cmo' && a.dept!=='cto'));
    log(boss.name, `指示: ${sub.name} → ${pick(TASKS).t}`, DEPT_COLOR[boss.dept]);
    setFocus(boss, '指示中');
  } else {                           /* 出退勤 */
    const a = pick(working.filter(x=>!['jobs','sara','ken'].includes(x.id)));
    const R = rig[a.id];
    if(R.present && Math.random()<.5 && working.length > 8){
      R.present = false; R.person.visible = false;
      log(a.name, '業務完了・退勤', DEPT_COLOR[a.dept]);
    } else if(!R.present){
      R.present = true; R.person.visible = true;
      log(a.name, '出社しました', DEPT_COLOR[a.dept]);
    }
  }
  const backs = AGENTS.filter(a=>!rig[a.id].present);
  if(backs.length && Math.random()<.3){
    const a = pick(backs);
    rig[a.id].present = true; rig[a.id].person.visible = true;
    log(a.name, '出社しました', DEPT_COLOR[a.dept]);
  }
  schedule();
}
let timer = null;
function schedule(){ clearTimeout(timer); timer = setTimeout(tick, 2300 + Math.random()*1800); }

/* 初期ログ */

/* ===== カメラ操作 ===== */
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('pointerdown', e=>{ dragging = true; lastX = e.clientX; lastY = e.clientY; camAuto = false; syncCamBtn(); });
addEventListener('pointerup', ()=> dragging = false);
addEventListener('pointermove', e=>{
  if(!dragging) return;
  camTheta -= (e.clientX-lastX) * .005;
  camPhi   -= (e.clientY-lastY) * .003;
  camPhi = Math.min(1.42, Math.max(.55, camPhi));
  camTheta = Math.min(.9, Math.max(-.9, camTheta));
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  camR = Math.min(30, Math.max(9, camR + e.deltaY*.02));
}, {passive:false});

const camBtn = $('btn-cam');
function syncCamBtn(){ camBtn.setAttribute('aria-pressed', String(camAuto)); }
camBtn.addEventListener('click', ()=>{ camAuto = !camAuto; syncCamBtn(); });
syncCamBtn();

const simBtn = $('btn-sim');
simBtn.addEventListener('click', ()=>{
  simOn = !simOn;
  simBtn.textContent = simOn ? '稼働中' : '停止中';
  simBtn.setAttribute('aria-pressed', String(simOn));
  if(simOn) schedule(); else clearTimeout(timer);
});
const bubBtn = $('btn-bubble');
bubBtn.addEventListener('click', ()=>{
  bubbleOn = !bubbleOn;
  bubBtn.setAttribute('aria-pressed', String(bubbleOn));
  if(!bubbleOn) [...activeBubs].forEach(removeBub);
});

/* モバイル: パネルをタップで開閉 */
if(matchMedia('(max-width:860px)').matches){
  $('board').classList.add('folded');
  $('board').querySelector('h2').addEventListener('click', ()=>$('board').classList.toggle('folded'));
  $('monitor').querySelector('h2').addEventListener('click', ()=>$('monitor').classList.toggle('folded'));
}

/* ===== ループ ===== */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const t = clock.getElapsedTime();
  const th = camAuto ? Math.sin(t*.07)*.32 : camTheta;
  if(camAuto) camTheta = th;
  camera.position.set(
    camTarget.x + camR*Math.sin(camPhi)*Math.sin(th),
    camTarget.y + camR*Math.cos(camPhi),
    camTarget.z + camR*Math.sin(camPhi)*Math.cos(th)
  );
  camera.lookAt(camTarget);
  for(const id in rig){
    const R = rig[id];
    if(!R.present) continue;
    R.person.position.y = (id==='jobs' ? .3 : 0) + Math.sin(t*2.2 + R.phase)*.015;
    R.head.rotation.y = Math.sin(t*.5 + R.phase)*.3;
  }
  layoutBubbles();
  renderer.render(scene, camera);
}
frame();
</script>
